server:
  port: 8081

spring:
  application:
    name: catalog-service
    
  jackson:
    serialization:
      write-bigdecimal-as-plain: true
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.1.101:5432/order_processing_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:password123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Optimasi Performa Java 21
  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:192.168.1.101}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://192.168.1.101:9200}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:192.168.1.101:9092}
    consumer:
      group-id: catalog-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer